services:
  db:
    image: mysql:8.0
    container_name: money_tracker_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root_secure_password_change_me}
      MYSQL_DATABASE: ${DATABASE_NAME:-personal_money_tracker}
      MYSQL_USER: ${DATABASE_USER:-money_tracker}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-change-me-production-db-pwd}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DB.SQL:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:${DATABASE_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_secure_password_change_me} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money_tracker_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-personal_money_tracker}
      DATABASE_USER: ${DATABASE_USER:-money_tracker}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me-production-db-pwd}
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-10}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
